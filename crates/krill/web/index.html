<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krill</title>
<link rel="stylesheet" href="/assets/xterm.css">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
body {
  background: #0e1116; color: #e6edf3;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  padding: 16px; max-width: 720px; margin: 0 auto;
}
h1 { font-size: 18px; margin-bottom: 12px; }
h1 small { color: #7d8590; font-weight: normal; font-size: 13px; }
.cards { display: grid; gap: 10px; }
.card {
  border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px;
  cursor: pointer; background: #161b22;
}
.card:active { background: #1f2630; }
.row1 { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: #7d8590; }
.active .dot { background: #3fb950; }
.quiet .dot { background: #d29922; }
.dead .dot { background: #f85149; }
.needs-you .dot { background: #d2a8ff; }
.needs-you { border-color: #8957e5; }
.done .dot { background: #58a6ff; }
.name { font-weight: 600; }
.meta { color: #7d8590; font-size: 13px; margin-left: auto; }
.sub { color: #7d8590; font-size: 13px; margin-top: 4px; }
.empty { color: #7d8590; text-align: center; padding: 40px 0; }
#panel { position: fixed; inset: 0; background: #0e1116; padding: 12px; display: none; flex-direction: column; }
#panel.open { display: flex; }
#panel header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
#term {
  flex: 1; min-height: 0; background: #0e1116; border: 1px solid #30363d;
  border-radius: 10px; padding: 8px; overflow: auto;
}
#quick { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
#quick button { min-width: 52px; }
#diffview {
  position: fixed; inset: 0; background: #0e1116; padding: 12px;
  display: none; flex-direction: column; z-index: 10;
}
#diffview.open { display: flex; }
#diffview pre {
  flex: 1; overflow: auto; background: #161b22; border: 1px solid #30363d;
  border-radius: 10px; padding: 12px;
  font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
  white-space: pre; 
}
.dadd { color: #3fb950; }
.ddel { color: #f85149; }
.dhunk { color: #58a6ff; }
button {
  background: #21262d; color: #e6edf3; border: 1px solid #30363d;
  border-radius: 8px; padding: 6px 12px; font-size: 14px;
}
</style>
</head>
<body>
<h1>krill 🦐 <small id="count"></small></h1>
<div class="cards" id="cards"><div class="empty">…</div></div>

<div id="panel">
  <header>
    <button id="back">←</button>
    <span class="name" id="pv-title"></span>
    <span class="meta" id="pv-meta"></span>
    <button id="diffbtn" style="margin-left:auto">diff</button>
  </header>
  <div id="term"></div>
  <div id="quick"></div>
</div>

<div id="diffview">
  <header style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
    <button id="diffback">←</button>
    <span class="name" id="diff-title"></span>
  </header>
  <pre id="diff-text"></pre>
</div>

<script src="/assets/xterm.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
const qs = token ? `?token=${encodeURIComponent(token)}` : '';
// The UMD build exposes either the class or a module object.
const XTerm = window.Terminal.Terminal || window.Terminal;
let current = null, term = null, ws = null;

function render(list) {
  const cards = document.getElementById('cards');
  document.getElementById('count').textContent = list.length ? `${list.length}` : '';
  if (!list.length) {
    cards.innerHTML = '<div class="empty">no sessions — krill new &lt;name&gt;</div>';
    return;
  }
  cards.innerHTML = '';
  for (const s of list) {
    const el = document.createElement('div');
    el.className = `card ${s.state}`;
    el.innerHTML = '<div class="row1"><span class="dot"></span><span class="name"></span>' +
      '<span class="meta"></span></div><div class="sub"></div>';
    el.querySelector('.name').textContent = s.name;
    el.querySelector('.meta').textContent = `${s.age} · ${s.diff}`;
    el.querySelector('.sub').textContent = `${s.repo} · ${s.agent} · ${s.state}`;
    el.onclick = () => openTerm(s);
    cards.appendChild(el);
  }
}

async function refresh() {
  try {
    const r = await fetch('/api/sessions' + qs);
    if (r.ok) render(await r.json());
  } catch (e) { /* transient network error: keep the last view */ }
}

function openTerm(s) {
  current = s;
  document.getElementById('pv-title').textContent = s.name;
  document.getElementById('pv-meta').textContent = `${s.repo} · ${s.agent}`;
  document.getElementById('panel').classList.add('open');

  // Fixed 80×24 (design §13): tmux renders for its smallest client, so
  // the web view matches the detached default instead of fighting it.
  term = new XTerm({
    cols: 80, rows: 24, fontSize: 13, scrollback: 2000, convertEol: false,
    theme: { background: '#0e1116' },
  });
  term.open(document.getElementById('term'));

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/${encodeURIComponent(s.repo)}/${encodeURIComponent(s.name)}${qs}`;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (!term) return;
    term.write(typeof e.data === 'string' ? e.data : new Uint8Array(e.data));
  };
  ws.onclose = () => { if (term) term.write('\r\n(connection closed)\r\n'); };
  term.onData((d) => { if (ws && ws.readyState === 1) ws.send(d); });
  term.focus();
}

function closeTerm() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (term) { term.dispose(); term = null; }
  current = null;
  document.getElementById('panel').classList.remove('open');
}

document.getElementById('back').onclick = closeTerm;

// Quick replies (§8.2): answer common agent prompts without typing.
// Each button sends canned keys through the same WS as the keyboard.
const QUICK = [
  ['y ⏎', 'y\r'],
  ['n ⏎', 'n\r'],
  ['⏎', '\r'],
  ['Esc', '\u001b'],
  ['^C', '\u0003'],
];
const quickBar = document.getElementById('quick');
for (const [label, keys] of QUICK) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => { if (ws && ws.readyState === 1) { ws.send(keys); term && term.focus(); } };
  quickBar.appendChild(b);
}

// Diff view: worktree vs base, colored by line prefix.
function renderDiff(text) {
  const pre = document.getElementById('diff-text');
  pre.textContent = '';
  if (!text.trim()) { pre.textContent = '(clean)'; return; }
  for (const line of text.split('\n')) {
    const span = document.createElement('span');
    if (line.startsWith('+') && !line.startsWith('+++')) span.className = 'dadd';
    else if (line.startsWith('-') && !line.startsWith('---')) span.className = 'ddel';
    else if (line.startsWith('@@')) span.className = 'dhunk';
    span.textContent = line + '\n';
    pre.appendChild(span);
  }
}

document.getElementById('diffbtn').onclick = async () => {
  if (!current) return;
  document.getElementById('diff-title').textContent = `${current.name} · diff`;
  document.getElementById('diffview').classList.add('open');
  const url = `/api/diff/${encodeURIComponent(current.repo)}/${encodeURIComponent(current.name)}` + qs;
  try {
    const r = await fetch(url);
    renderDiff(r.ok ? await r.text() : `(${r.status})`);
  } catch (e) { renderDiff('(error)'); }
};
document.getElementById('diffback').onclick = () => {
  document.getElementById('diffview').classList.remove('open');
};

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
