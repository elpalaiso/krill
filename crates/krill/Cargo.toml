[package]
name = "krill"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tiny orchestrator for AI coding agents — tmux + git worktrees"

[dependencies]
axum = "0.8"
krill-core = { path = "../krill-core" }
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net"] }
