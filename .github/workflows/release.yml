# Tag v* → native builds on 4 platforms → tar.gz + sha256 attached to a
# GitHub Release. No cross-compilation: GitHub provides arm64 runners
# for both Linux and macOS, so every target builds natively (release
# profile already strips + LTOs; the binary is ~2 MB).
#
# Release flow: bump the workspace version, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p krill
      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf krill-${{ github.ref_name }}-${{ matrix.target }}.tar.gz krill
          shasum -a 256 krill-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            > krill-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/krill-*.tar.gz
            target/${{ matrix.target }}/release/krill-*.sha256
